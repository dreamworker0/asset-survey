name: Preview — PR 미리보기

on:
  pull_request:
    branches: [master]
    # closed를 넣으면 기본 목록(opened·synchronize·reopened)이 대체되므로 전부 나열한다.
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    # 러너 전환 — deploy.yml과 같은 DEPLOY_RUNNER(운영 서비스 계정 키를 다루는 잡끼리 한 스위치).
    # Dependabot PR은 항상 호스티드: 외부 패키지 새 버전의 install 스크립트가 상주 러너에 닿지 않게(ci.yml 상단).
    # ⚠️ 삼항의 참 쪽에 falsy 값을 두지 말 것.
    runs-on: ${{ ((github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest') || vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        # 비밀값은 환경 변수로 넘겨 그대로 쓴다 — `echo "${{ secrets.X }}"`로 쓰면 값 안의 백틱·$가
        # 셸에서 해석돼 파일이 깨진다(2026-11-21 첫 CI: .env 주석의 백틱 때문에 빌드 실패).
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Build
        run: npm run build

      # 서드파티 액션(action-hosting-deploy)은 서비스계정을 전달받는 공급망 리스크가 있어
      # deploy.yml과 동일하게 firebase-tools CLI 직접 호출로 대체한다 (2026-06-26 보안 감사 F1).
      # 프리뷰 URL은 스텝 로그에 출력된다.
      - name: Deploy to Preview Channel
        if: github.actor != 'dependabot[bot]'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          # 스텝이 어떻게 끝나든 키 파일을 지운다 — 셀프호스티드 러너는 /tmp가 다음 잡까지 남는다
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" --expires 3d --project "${{ vars.FIREBASE_PROJECT_ID }}"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  # PR이 닫히면 그 미리보기 채널을 지운다.
  #
  # 채널은 3일 뒤 만료되지만 **만료돼도 자동 삭제되지 않고 할당량(사이트당 50개)만 차지한다.**
  # 2026-09-06에 하루 여섯 개의 PR을 열다 한도에 닿아 preview 체크가 429로 죽었고,
  # 만료된 19개를 손으로 지워야 했다(Phase 216). 그때 지운 것들은 전부 이미 머지된 PR의
  # 채널이었다 — 즉 닫히는 시점에 지웠으면 애초에 쌓이지 않았다.
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    # 러너 전환 — 위 preview 잡과 같다
    runs-on: ${{ ((github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest') || vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # firebase.json이 있어야 CLI가 대상 사이트를 정한다. 체크아웃을 빼면
      # "Not in a Firebase app directory"로 실패한다(#348에서 실제로 그랬다).
      # sparse checkout은 쓰지 않는다 — 셀프호스티드 러너는 작업 폴더를 다음 잡과 같이 쓰는데,
      # 여기서 남긴 sparse 설정 때문에 다음 CI의 security-audit가 scripts/를 못 찾아 실패했고
      # 이 잡 자신도 firebase.json을 못 찾았다(2026-11-24, PR #11 닫힘 직후). 전체를 받아도 몇 초다.
      - uses: actions/checkout@v7

      - name: Delete preview channel
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          # 스텝이 어떻게 끝나든 키 파일을 지운다 — 셀프호스티드 러너는 /tmp가 다음 잡까지 남는다
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          CHANNEL="pr-${{ github.event.number }}"
          # 채널이 없는 것은 정상 경로다(dependabot PR은 배포 스텝을 건너뛰고, 3일 넘게 열려
          # 있던 PR은 이미 만료됐을 수 있다). 하지만 **그 한 가지만** 봐준다 — #348에서
          # `|| echo`로 전부 삼켰다가 설정 오류를 초록으로 덮었다.
          set +e
          OUT=$(npx firebase-tools hosting:channel:delete "$CHANNEL" --force --project "${{ vars.FIREBASE_PROJECT_ID }}" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ] || echo "$OUT" | grep -q "HTTP Error: 404"; then
            if echo "$OUT" | grep -q "HTTP Error: 404"; then
              echo "채널 $CHANNEL 없음 — 지울 것이 없다"
            else
              echo "::error::채널 $CHANNEL 삭제 실패"
              rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
              exit 1
            fi
          fi
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # 지워졌는지 실제로 확인한다. 삭제 명령이 조용히 실패해도 목록에는 남는다.
      - name: Verify deletion
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          # 스텝이 어떻게 끝나든 키 파일을 지운다 — 셀프호스티드 러너는 /tmp가 다음 잡까지 남는다
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          CHANNEL="pr-${{ github.event.number }}"
          # 채널 name은 "projects/…/sites/…/channels/pr-N" 한 문자열이다. 뒤따옴표까지 붙여야
          # 릴리스 경로("…/channels/pr-N/releases/…")와 접두 채널(pr-34 vs pr-348)에 걸리지 않는다.
          LIST=$(npx firebase-tools hosting:channel:list --project "${{ vars.FIREBASE_PROJECT_ID }}" --json)
          if echo "$LIST" | grep -q "channels/$CHANNEL\""; then
            echo "::error::$CHANNEL 이 목록에 아직 남아 있다"
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            exit 1
          fi
          echo "$CHANNEL 삭제 확인"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
